# Healthcare QA Agents - GitHub Actions CI/CD Pipeline
# Purpose: Automate linting, unit testing, schema validation, and Docker container build verification.

name: Healthcare QA Agents CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Lint and Pytest Suite
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest Test Suite
        env:
          JWT_SECRET_KEY: test-secret-key-for-github-actions-32chars
          CONFIDENCE_THRESHOLD: 0.75
        run: |
          pytest --tb=short

  docker-build:
    name: Build Docker Container
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: healthcare-qa-agents:latest
