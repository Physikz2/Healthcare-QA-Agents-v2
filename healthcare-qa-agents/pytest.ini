# Healthcare QA Agents - Pytest Configuration
# Purpose: Configure test discovery, markers, and asyncio mode for test suites.

[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
addopts = -v --tb=short
markers =
    unit: Quick isolated unit tests
    integration: Integration tests involving multi-agent workflows
    api: FastAPI endpoint tests
